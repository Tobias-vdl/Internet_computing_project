function frameIndex(seq, t) {
    return Math.floor(t / seq.timing) % seq.count;
}
function drawSprite(ctx, sheet, seq, index, x, y, scale) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(x, y + 10 * scale, 7 * scale, 2 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.drawImage(sheet, seq.x + index * seq.width, seq.y, seq.width, seq.height,
        x - seq.width * scale / 2, y - seq.height * scale / 2, seq.width * scale, seq.height * scale);
}

const arena = document.getElementById("arena");
const actx = arena.getContext("2d");
actx.imageSmoothingEnabled = false;

function makeFloor() {
    const c = document.createElement("canvas");
    c.width = 760; c.height = 360;
    const g = c.getContext("2d");
    for (let y = 0; y < 360; y += 40)
        for (let x = 0; x < 760; x += 40) {
            const wall = y === 0 || y === 320 || x === 0 || x === 720;
            const v = ((x * 7 + y * 13) % 5) * 3;
            g.fillStyle = wall ? "rgb(" + (82 + v) + "," + (86 + v) + "," + (102 + v) + ")" : "rgb(" + (40 + v) + "," + (44 + v) + "," + (56 + v) + ")";
            g.fillRect(x, y, 40, 40);
            g.fillStyle = "rgba(0,0,0,0.3)";
            g.fillRect(x + 38, y, 2, 40);
            g.fillRect(x, y + 38, 40, 2);
        }
    return c;
}
const floor = makeFloor();

const players = [
    { sheet: "blue", x: 260, y: 180, dir: "Down", moving: false,
      keys: { KeyA: "Left", KeyW: "Up", KeyD: "Right", KeyS: "Down" } },
    { sheet: "red", x: 500, y: 180, dir: "Down", moving: false,
      keys: { ArrowLeft: "Left", ArrowUp: "Up", ArrowRight: "Right", ArrowDown: "Down" } }
];
const held = new Set();
arena.addEventListener("keydown", e => { held.add(e.code); e.preventDefault(); });
arena.addEventListener("keyup", e => held.delete(e.code));
arena.addEventListener("click", () => arena.focus());

// Demo mode: the archers wander until someone presses a key
let demo = true;
arena.addEventListener("keydown", () => demo = false);
const demoDirs = ["Left", "Up", "Right", "Down"];

let last = 0;
function arenaFrame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    actx.drawImage(floor, 0, 0);

    players.forEach((p, i) => {
        let dir = null;
        if (demo) {
            const phase = Math.floor((t + i * 900) / 1400) % 6;
            dir = phase < 4 ? demoDirs[(phase + i * 2) % 4] : null;
        } else {
            for (const code in p.keys) if (held.has(code)) dir = p.keys[code];
        }
        p.moving = dir !== null;
        if (dir) {
            p.dir = dir;
            const speed = 110 * dt;
            if (dir === "Left") p.x -= speed;
            if (dir === "Right") p.x += speed;
            if (dir === "Up") p.y -= speed;
            if (dir === "Down") p.y += speed;
            p.x = Math.max(64, Math.min(696, p.x));
            p.y = Math.max(64, Math.min(290, p.y));
        }
    });
    players.slice().sort((a, b) => a.y - b.y).forEach(p => {
        const seq = sequences[(p.moving ? "move" : "idle") + p.dir];
        drawSprite(actx, sheets[p.sheet], seq, frameIndex(seq, t), p.x, p.y, 2);
    });
    requestAnimationFrame(arenaFrame);
}

// ---------- Gallery ----------
const gallery = document.getElementById("gallery");
const gctx = gallery.getContext("2d");
gctx.imageSmoothingEnabled = false;
const names = ["idleDown", "idleLeft", "idleUp", "idleRight", "moveDown", "moveLeft", "moveUp", "moveRight"];

function galleryFrame(t) {
    gctx.fillStyle = "#171922";
    gctx.fillRect(0, 0, 760, 420);
    gctx.font = "8px 'Press Start 2P', monospace";
    gctx.textAlign = "center";
    names.forEach((n, i) => {
        const col = i % 4, row = Math.floor(i / 4);
        const cx = 95 + col * 190;
        gctx.fillStyle = "#9a958a";
        gctx.fillText(n, cx, 20 + row * 210);
        ["blue", "red"].forEach((s, k) => {
            const seq = sequences[n];
            drawSprite(gctx, sheets[s], seq, frameIndex(seq, t), cx - 40 + k * 80, 105 + row * 210, 3);
        });
    });
    requestAnimationFrame(galleryFrame);
}

Promise.all([sheets.blue.decode(), sheets.red.decode(), document.fonts.ready]).then(() => {
    requestAnimationFrame(arenaFrame);
    requestAnimationFrame(galleryFrame);
});
</script>
</body>
